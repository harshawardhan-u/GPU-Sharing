<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Captions</title>
<style>
  :root { --bg: #08090f; --panel: #12141e; --line: #23273a; --ink: #f0efec; --ink2: #9aa0b4; --accent: #2a78d6; --size: 26px; }
  body.light { --bg: #fcfcfb; --panel: #f1f1ee; --line: #dddcd6; --ink: #0b0b0b; --ink2: #52514e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: 1px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #e34948; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #e34948; animation: p 1.2s infinite; }
  @keyframes p { 50% { opacity: .3; } }
  .meta { color: var(--ink2); font-size: 12px; }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .tools button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
                  padding: 6px 10px; font-size: 14px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; font-size: var(--size); line-height: 1.45; }
  .line { margin: 0 0 14px; }
  .line small { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  #partial { color: var(--ink2); }
  #partial:not(:empty)::after { content: "▍"; animation: p 1s infinite; }
  .empty { color: var(--ink2); font-size: 18px; }
  footer { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 12px; color: var(--ink2); }
</style>
</head>
<body>
<header>
  <h1>LIVE CAPTIONS</h1><span class="live"><i></i>LIVE</span>
  <span class="meta" id="meta">connecting…</span>
  <div class="tools"><button id="smaller">A−</button><button id="bigger">A+</button><button id="theme">◐</button></div>
</header>
<div id="log"><div class="empty" id="empty">Waiting for the speaker…</div><div class="line" id="partial"></div></div>
<footer id="foot">Speech recognition runs on a borrowed GPU. This device only shows the text.</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), partial = $("partial");
let size = 26;
$("bigger").onclick = () => { size = Math.min(56, size + 4); document.documentElement.style.setProperty("--size", size + "px"); };
$("smaller").onclick = () => { size = Math.max(16, size - 4); document.documentElement.style.setProperty("--size", size + "px"); };
$("theme").onclick = () => document.body.classList.toggle("light");

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 120; }

function addLine(item) {
  $("empty").style.display = "none";
  const stick = nearBottom();
  const el = document.createElement("div");
  el.className = "line";
  el.innerHTML = `<small>${item.t} · shown ${(item.latency_ms / 1000).toFixed(1)} s after speech</small>${esc(item.text)}`;
  log.insertBefore(el, partial);
  if (stick) log.scrollTop = log.scrollHeight;
}

function status(m) {
  const parts = [`on ${m.gpu}`];
  if (m.speed_x) parts.push(`${m.speed_x}× faster than speech`);
  if (m.latency_ms) parts.push(`avg delay ${(m.latency_ms / 1000).toFixed(1)} s`);
  parts.push(`${m.listeners} listening`);
  $("meta").textContent = parts.join(" · ");
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ role: "listener" }));
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "history") { m.items.forEach(addLine); status(m); }
    else if (m.type === "final") { partial.textContent = ""; addLine(m); }
    else if (m.type === "partial") { const stick = nearBottom(); partial.textContent = m.text; if (stick) log.scrollTop = log.scrollHeight; }
    else if (m.type === "status") status(m);
  };
  ws.onclose = () => { $("meta").textContent = "reconnecting…"; setTimeout(connect, 1500); };
}
connect();
</script>
</body>
</html>
